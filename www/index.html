<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TabunganKu Kelas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ac:#1B7F45;--lk:#1B7F45;--bg:#fff;--fg:#1C2A22;--mu:#5A6B62;--gr:#E9E9E9;--mint:#D6EBD9;--pe:#F6DDCF;--li:#E4DDF3;--bd:#C7D1CB;--or:#F28C28;--er:#FDECEA;--ert:#912018;--ok:#0B6B3A;--ng:#B42318}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--lk:#4FD08A;--bg:#0F1A14;--fg:#E8EFEA;--mu:#A9B8B0;--gr:#25322B;--mint:#1F4A32;--pe:#4A3426;--li:#3A3350;--bd:#3C4B44;--er:#501313;--ert:#F7C1C1;--ok:#6FD39A;--ng:#F28B82}}
:root[data-theme="dark"]{color-scheme:dark;--lk:#4FD08A;--bg:#0F1A14;--fg:#E8EFEA;--mu:#A9B8B0;--gr:#25322B;--mint:#1F4A32;--pe:#4A3426;--li:#3A3350;--bd:#3C4B44;--er:#501313;--ert:#F7C1C1;--ok:#6FD39A;--ng:#F28B82}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#v{max-width:520px;margin:0 auto;padding-bottom:84px}
h1,h2{margin:0}button{font:inherit;cursor:pointer;border:0;color:inherit}
.ic{flex:none}
.spl,.wel{min-height:100svh;background:var(--ac);display:flex}
.spl{align-items:center;justify-content:center}
.logo{font-size:30px;font-weight:700;color:var(--ac)}.spl .logo{color:#fff;font-size:36px}
.logo i{font-style:normal;background:var(--or);color:#fff;border-radius:8px;padding:0 8px;margin-left:4px}
.wel{flex-direction:column}.wtop{flex:1;display:flex;align-items:center;justify-content:center}
.wsh{background:var(--bg);border-radius:32px 32px 0 0;padding:28px 24px 32px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.wsh p{margin:0;color:var(--mu)}.wsh .bp{width:60%}
.top{background:var(--ac);color:#fff;padding:24px 20px 60px}.top h1{font-size:28px;line-height:1.2}.top p{margin:4px 0 14px;opacity:.9}
.srch{display:flex;align-items:center;gap:8px;background:#fff;color:#1C2A22;border-radius:24px;padding:0 16px;min-height:44px}
.srch input{flex:1;border:0;outline:0;background:none;font:inherit;color:inherit;min-width:0}
.sheet{margin-top:-36px;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.tot{background:var(--mint);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.tot b{font-size:22px}
.chips{display:flex;gap:8px;overflow-x:auto}.chips button,.pills button{min-height:36px;padding:0 16px;border-radius:20px;background:var(--gr);white-space:nowrap}
.chips .on,.pills .on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.mint{background:var(--mint)}.pe{background:var(--pe)}.gr{background:var(--gr)}.li2{background:var(--li)}
.av{width:44px;height:44px;border-radius:50%;background:var(--bg);color:var(--lk);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.sc span{color:var(--mu);font-size:14px}
.qa{display:flex;gap:6px;margin-top:6px}.qa button{flex:1;min-height:32px;border-radius:16px;background:var(--bg);color:var(--lk);font-size:12px;font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;background:none;color:var(--mu);font-size:11px;justify-content:center}nav .on{color:var(--lk);font-weight:600}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}.hd h1{font-size:17px}
.ib{width:44px;height:44px;background:none;display:flex;align-items:center;justify-content:center;border-radius:50%}
.pg{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.dtop{background:var(--mint);padding:10px 12px 52px;display:flex;flex-direction:column;align-items:center}.dtop .ib{align-self:flex-start}
.avl{width:110px;height:110px;border-radius:50%;background:var(--bg);color:var(--lk);font-size:48px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pills{display:flex;gap:4px;width:fit-content;margin:0 auto;background:var(--bg);border-radius:24px;padding:4px;box-shadow:0 1px 6px rgba(0,0,0,.18)}.dtop+.pills{margin-top:-26px;margin-bottom:12px}
label{font-size:14px;font-weight:600;color:var(--mu)}
input,select{width:100%;box-sizing:border-box;min-height:48px;border:0;border-radius:24px;padding:0 18px;font:inherit;background:var(--mint);color:var(--fg)}
.card{background:var(--gr);border-radius:16px;padding:12px 16px}
.inf{background:var(--gr);border-radius:16px;padding:14px 16px}.inf h2{font-size:18px;margin-bottom:4px}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bp,.bt{min-height:50px;border-radius:25px;font-weight:600;padding:0 14px}.bp{background:var(--ac);color:#fff}.bt{background:var(--bg);color:var(--lk);border:1.5px solid var(--lk)}
.lnk{background:none;color:var(--ng);min-height:44px}
.oc{display:flex;align-items:center;gap:12px;background:var(--gr);border-radius:16px;padding:12px}
.ci{width:40px;height:40px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
.ot{flex:1}.ot small{display:block;color:var(--mu)}.or{text-align:right}.or em{display:inline-block;font-style:normal;font-size:11px;background:var(--bg);padding:1px 10px;border-radius:12px;margin-top:2px}
.er{background:var(--er);color:var(--ert);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px}
.ok{color:var(--ok)}.ng{color:var(--ng)}.mu{color:var(--mu);font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mb{background:var(--bg);width:100%;max-width:520px;box-sizing:border-box;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#ts{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:30}#ts.on{opacity:1}
</style></head><body>
<main id="v"></main><div id="ts" role="status"></div>
<script>
var K='tabunganku_v2',mem=null,$=function(i){return document.getElementById(i)},Q=function(s){return document.querySelectorAll(s)};
function load(){var d=null;try{d=JSON.parse(localStorage.getItem(K)||localStorage.getItem('tabunganku_v1'))}catch(e){}d=d||mem||{};return{s:d.s||[],b:d.b||{},r:d.r||[],k:d.k||'Kelas XI',iu:d.iu||5000,w:d.w||0}}
var D=load();function save(){mem=D;try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
var hq='',hf='all',dn='',dtab='d',tm='S',ts='',rf='all',CL=['mint','pe','gr','li2'];
function rp(n){return 'Rp '+Number(n).toLocaleString('id-ID')}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function total(){return D.s.reduce(function(a,n){return a+(D.b[n]||0)},0)}
function idx(n){return D.s.indexOf(n)}
function fd(t){var d=new Date(t);return('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear()}
function sums(n){var s=0,t=0,c=0;D.r.forEach(function(x){if(x.n==n){c++;if(x.j=='Setor')s+=x.v;else t+=x.v}});return[s,t,c]}
function toast(m){var t=$('ts');t.textContent=m;t.className='on';clearTimeout(toast.i);toast.i=setTimeout(function(){t.className=''},2200)}
function ic(n,z){var P={home:'M3 11l9-8 9 8M5 10v10h14V10',swap:'M7 7h13l-4-4M17 17H4l4 4',clock:'M12 7v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6',search:'M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4-4',plus:'M12 5v14M5 12h14',back:'M15 5l-7 7 7 7',up:'M12 19V5M5 12l7-7 7 7',down:'M12 5v14M5 12l7 7 7-7'};return'<svg class="ic" width="'+(z||22)+'" height="'+(z||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+P[n]+'"/></svg>'}
function logo(){return'<div class="logo">Tabungan<i>Ku</i></div>'}
function page(t,b){return'<header class="hd"><button class="ib" data-go="home" aria-label="Kembali">'+ic('back')+'</button><h1>'+t+'</h1><span class="ib"></span></header><div class="pg">'+b+'</div>'}
function bnav(p){return'<nav>'+[['home','Beranda','home'],['trx','Transaksi','swap'],['riwayat','Riwayat','clock'],['kelas','Kelas','user']].map(function(x){return'<button data-go="'+x[0]+'" class="'+(p==x[0]||(p=='detail'&&x[0]=='home')?'on':'')+'">'+ic(x[2])+'<span>'+x[1]+'</span></button>'}).join('')+'</nav>'}
function chips(a,cur,k){return'<div class="chips">'+a.map(function(x){return'<button data-'+k+'="'+x[0]+'" class="'+(cur==x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>'}
function cards(){var q=hq.toLowerCase(),l=D.s.filter(function(n){var b=D.b[n]||0;return n.toLowerCase().indexOf(q)>-1&&(hf=='all'||(hf=='ada'?b>0:b==0))});return l.length?l.map(function(n){return'<div class="sc '+CL[idx(n)%4]+'" data-d="'+esc(n)+'"><div class="av">'+esc(n.charAt(0).toUpperCase())+'</div><b>'+esc(n)+'</b><span>'+rp(D.b[n]||0)+'</span><div class="qa"><button data-s="'+esc(n)+'">Setor</button><button data-t="'+esc(n)+'">Tarik</button></div></div>'}).join(''):'<p class="mu" style="grid-column:1/-1">Belum ada siswa. Tekan tombol + untuk menambah.</p>'}
function hlist(a){a=a.slice().reverse();return a.length?a.map(function(x){var p=x.j=='Setor';return'<div class="oc"><div class="ci '+(p?'ok':'ng')+'">'+ic(p?'up':'down',18)+'</div><div class="ot"><b>'+esc(x.n)+'</b><small>'+fd(x.t)+'</small></div><div class="or"><b class="'+(p?'ok':'ng')+'">'+(p?'+ ':'- ')+rp(x.v)+'</b><br><em>'+x.j+'</em></div></div>'}).join(''):'<p class="mu">Belum ada transaksi.</p>'}
var V={};
V.welcome=function(){return'<div class="wel"><div class="wtop"><svg viewBox="0 0 200 150" width="230" aria-hidden="true"><g fill="#F28C28" stroke="#fff" stroke-width="3"><ellipse cx="100" cy="122" rx="62" ry="16"/><ellipse cx="100" cy="102" rx="62" ry="16"/><ellipse cx="100" cy="82" rx="62" ry="16"/></g><ellipse cx="100" cy="60" rx="62" ry="16" fill="#FFD27A" stroke="#fff" stroke-width="3"/><text x="100" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#B35F00">Rp</text></svg></div><div class="wsh">'+logo()+'<p>Catat tabungan kelas dengan rapi: setoran, penarikan, saldo, dan riwayat.</p><button class="bp" id="go">Mulai</button></div></div>'};
V.home=function(){return'<section class="top"><h1>Tabungan Kelas</h1><p>'+esc(D.k)+' · '+D.s.length+' siswa</p><label class="srch">'+ic('search',18)+'<input id="q" placeholder="Cari siswa..." value="'+esc(hq)+'" autocomplete="off" aria-label="Cari siswa"></label></section><section class="sheet"><div class="tot"><span>Total Kas Kelas</span><b>'+rp(total())+'</b></div>'+chips([['all','Semua'],['ada','Ada saldo'],['nol','Belum menabung']],hf,'f')+'<div class="grid" id="gr">'+cards()+'</div></section><button class="fab" id="fab" aria-label="Tambah siswa">'+ic('plus',26)+'</button>'};
V.detail=function(){var n=dn,i=idx(n);if(i<0)return V.home();var m=sums(n),b=dtab=='d'?'<div class="inf"><h2>'+esc(n)+'</h2><div class="li"><span>Saldo saat ini</span><b>'+rp(D.b[n]||0)+'</b></div><div class="li"><span>Total setoran</span><b>'+rp(m[0])+'</b></div><div class="li"><span>Total penarikan</span><b>'+rp(m[1])+'</b></div><div class="li"><span>Jumlah transaksi</span><b>'+m[2]+'</b></div></div><div class="g2"><button class="bp" data-s="'+esc(n)+'">Setor</button><button class="bt" data-t="'+esc(n)+'">Tarik</button></div><button class="lnk" id="del">Hapus siswa</button>':hlist(D.r.filter(function(x){return x.n==n}));return'<div class="dtop"><button class="ib" data-go="home" aria-label="Kembali">'+ic('back')+'</button><div class="avl">'+esc(n.charAt(0).toUpperCase())+'</div></div><div class="pills"><button data-tab="d" class="'+(dtab=='d'?'on':'')+'">Detail</button><button data-tab="h" class="'+(dtab=='h'?'on':'')+'">Riwayat</button></div><div class="pg">'+b+'</div>'};
V.trx=function(){var b;if(!D.s.length)b='<p>Tambahkan siswa dulu di Beranda.</p><button class="bp" data-go="home">Ke Beranda</button>';else{if(idx(ts)<0)ts=D.s[0];b='<div class="pills"><button data-m="S" class="'+(tm=='S'?'on':'')+'">Setor</button><button data-m="T" class="'+(tm=='T'?'on':'')+'">Tarik</button></div><label for="sw">Pilih siswa</label><select id="sw">'+D.s.map(function(n){return'<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join('')+'</select><div class="card" id="sd"></div><label for="nom">Nominal (Rp)</label><input id="nom" inputmode="numeric" placeholder="0" autocomplete="off"><div class="g3">'+[D.iu,10000,20000].filter(function(v,i,a){return a.indexOf(v)==i}).map(function(x){return'<button class="bt" data-q="'+x+'">'+x.toLocaleString('id-ID')+'</button>'}).join('')+'</div><div id="er" class="er" hidden></div><button class="bp" id="ok">'+(tm=='S'?'Simpan Setoran':'Tarik Tabungan')+'</button>'}return page('Transaksi',b)};
V.riwayat=function(){return page('Riwayat Transaksi',chips([['all','Semua'],['S','Setor'],['T','Tarik']],rf,'r')+hlist(D.r.filter(function(x){return rf=='all'||(rf=='S')==(x.j=='Setor')})))};
V.kelas=function(){return page('Kelas','<label for="kn">Nama kelas</label><input id="kn" value="'+esc(D.k)+'" autocomplete="off"><label for="ki">Setoran bawaan (Rp)</label><input id="ki" inputmode="numeric" value="'+D.iu+'"><button class="bp" id="ks">Simpan</button>'+(D.s.length?'<button class="bt" id="rst">Hapus semua data</button>':'<button class="bt" id="demo">Isi data contoh</button>')+'<p class="mu">Data tersimpan di perangkat ini.</p>')};
function go(p){if(location.hash.slice(1)==p)render(p);else location.hash=p}
function cur(){var h=location.hash.slice(1);return V[h]&&h!='welcome'?h:'home'}
function render(p){$('v').innerHTML=V[p]()+(p=='welcome'?'':bnav(p));bind(p);scrollTo(0,0)}
function bc(r){r.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(e){e.stopPropagation();ts=b.dataset.s;tm='S';go('trx')}});r.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(e){e.stopPropagation();ts=b.dataset.t;tm='T';go('trx')}});r.querySelectorAll('[data-d]').forEach(function(c){c.onclick=function(){dn=c.dataset.d;dtab='d';go('detail')}})}
function modal(){var d=document.createElement('div');d.className='ov';d.innerHTML='<div class="mb"><h2>Tambah siswa</h2><input id="nm" placeholder="Nama siswa" autocomplete="off" aria-label="Nama siswa"><div class="g2"><button class="bt" id="mc">Batal</button><button class="bp" id="ma">Tambah</button></div></div>';document.body.appendChild(d);$('nm').focus();$('mc').onclick=function(){d.remove()};d.onclick=function(e){if(e.target==d)d.remove()};$('ma').onclick=function(){var n=$('nm').value.trim();if(!n)return toast('Nama tidak boleh kosong');if(D.s.some(function(x){return x.toLowerCase()==n.toLowerCase()}))return toast('Nama sudah ada');D.s.push(n);D.b[n]=0;save();d.remove();render('home');toast('Siswa ditambahkan')}}
function demo(){['Andi','Bunga','Citra','Dimas','Eka','Fajar'].forEach(function(n,i){var v=[45000,30000,60000,0,25000,80000][i];D.s.push(n);D.b[n]=v;if(v)D.r.push({t:new Date(Date.now()-i*864e5).toISOString(),n:n,j:'Setor',v:v})});save();render('kelas');toast('Data contoh ditambahkan')}
function bind(p){
 Q('[data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go)}});bc(document);
 Q('[data-f]').forEach(function(b){b.onclick=function(){hf=b.dataset.f;render('home')}});
 Q('[data-r]').forEach(function(b){b.onclick=function(){rf=b.dataset.r;render('riwayat')}});
 Q('[data-tab]').forEach(function(b){b.onclick=function(){dtab=b.dataset.tab;render('detail')}});
 if(p=='welcome')$('go').onclick=function(){D.w=1;save();go('home')};
 if(p=='home'){$('q').oninput=function(){hq=this.value;$('gr').innerHTML=cards();bc($('gr'))};$('fab').onclick=modal}
 if(p=='detail'&&$('del'))$('del').onclick=function(){if(confirm('Hapus siswa ini beserta riwayatnya?')){D.s=D.s.filter(function(x){return x!=dn});delete D.b[dn];D.r=D.r.filter(function(x){return x.n!=dn});save();go('home')}};
 if(p=='kelas'){$('ks').onclick=function(){D.k=$('kn').value.trim()||'Kelas';D.iu=Number($('ki').value.replace(/\D/g,''))||5000;save();toast('Tersimpan')};var d=$('demo'),r=$('rst');if(d)d.onclick=demo;if(r)r.onclick=function(){if(confirm('Hapus semua data tabungan?')){D.s=[];D.b={};D.r=[];save();render('kelas')}}}
 if(p=='trx'&&D.s.length){var sw=$('sw'),nom=$('nom'),er=$('er'),upd=function(){ts=sw.value;$('sd').innerHTML='Saldo saat ini: <b>'+rp(D.b[ts]||0)+'</b>'};sw.value=ts;sw.onchange=upd;upd();
  Q('[data-m]').forEach(function(b){b.onclick=function(){tm=b.dataset.m;render('trx')}});Q('[data-q]').forEach(function(b){b.onclick=function(){nom.value=b.dataset.q}});
  $('ok').onclick=function(){var v=Number(nom.value.replace(/\D/g,'')),s=sw.value,sal=D.b[s]||0;er.hidden=true;
   if(!v){er.textContent='Masukkan nominal yang benar';er.hidden=false;return}
   if(tm=='T'&&v>sal){er.textContent='Saldo tidak cukup untuk penarikan ini.';er.hidden=false;return}
   D.b[s]=tm=='S'?sal+v:sal-v;D.r.push({t:new Date().toISOString(),n:s,j:tm=='S'?'Setor':'Tarik',v:v});save();nom.value='';upd();toast(tm=='S'?'Setoran berhasil':'Penarikan berhasil')}}
}
window.onhashchange=function(){render(cur())};
$('v').innerHTML='<div class="spl">'+logo()+'</div>';
setTimeout(function(){D.w?render(cur()):render('welcome')},1100);
</script></body></html>
